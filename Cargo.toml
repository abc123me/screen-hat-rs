[package]
name = "screen-hat-rs"
version = "0.1.1"
edition = "2021"

[dependencies]
cfg-if = "1.0.4"
clap = "4.6.6"
framebuffer = "0.3.1"
image = "0.25.10"
rand = "0.10.0"

[dependencies.sdl2]
version = "0.38.0"
optional = true

[dependencies.fbgl]
default-features = false
git = "https://github.com/abc123me/fbgl-rs.git"
tag = "v0.2.3"

[features]
default = [ "fbgl/fbdev", "fbgl/img" ]
sdl = [ "sdl2", "fbgl/sdl", "fbgl/img" ]
