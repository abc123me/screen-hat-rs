[package]
name = "screen-hat-rs"
version = "0.1.5"
edition = "2021"

[dependencies]
cfg-if = "1.0.4"
clap = "4.6.6"
fontdue = "0.9.4"
framebuffer = "0.3.1"
image = "0.25.10"
rand = "0.10.0"

[dependencies.sdl2]
version = "0.38.0"
optional = true

[dependencies.fbgl]
default-features = false
#path = "/opt/bsp/misc/fbgl-rs"
git = "https://github.com/abc123me/fbgl-rs.git"
tag = "v0.2.6"

[features]
default = [ "fbgl/fbdev", "fbgl/img", "fbgl/text", "fbgl/ddmafb" ]
sdl = [ "sdl2", "fbgl/sdl", "fbgl/img", "fbgl/text" ]
